name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore VoluLens.sln
      - name: Build
        run: dotnet build VoluLens.sln -c Release --no-restore
      - name: Test
        run: dotnet test VoluLens.sln -c Release --no-build

